schema = 1

[board]
id = "m5stack_tab5"
name = "M5Stack Tab5"
vendor = "M5Stack"
module = "ESP32-P4"

[target]
mcu = "esp32p4"
platformio_board = "m5stack_tab5"

[build]
drivers = [
  "cdc_usb_serial_jtag",
  "uart_esp_idf",
  "display_m5tab5",
  "pointer_m5tab5",
  "storage_sdmmc",
  "i2c_esp_idf",
  "audio_es8311_duplex",
  "gpio_esp_idf",
  "pwm_esp_idf",
  "battery_ina226",
  "rtc_rx8130",
]
capabilities = [
  "streaming_display",
  "psram", "display", "gfx", "display_brightness", "pointer",
  "cdc", "uart", "sd", "i2c", "battery", "audio",
  "audio_input", "gpio", "pwm", "rtc",
  "expansion_gpio", "expansion_i2c", "expansion_uart",
  "expansion_i2s", "wifi",
]
required_packages = ["m5tab5_keyboard"]
psram_bytes = 16777216

[defines]
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"ST7123"'
SOLAR_OS_BOARD_DISPLAY_CONTROLLER_ST7123 = "1"
SOLAR_OS_BOARD_DISPLAY_DRIVER_NAME = '"m5tab5"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "1280"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "720"
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "720"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "1280"
SOLAR_OS_BOARD_PIN_LCD_BL = "GPIO_NUM_22"
SOLAR_OS_BOARD_LCD_BACKLIGHT_ACTIVE_LEVEL = "1"
SOLAR_OS_BOARD_LCD_BACKLIGHT_PWM = "1"
SOLAR_OS_BOARD_LCD_BACKLIGHT_PWM_FREQ_HZ = "20000U"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_31"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_32"
SOLAR_OS_BOARD_PIN_TOUCH_INT = "GPIO_NUM_23"
SOLAR_OS_BOARD_PIN_SDMMC_CLK = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_SDMMC_CMD = "GPIO_NUM_44"
SOLAR_OS_BOARD_PIN_SDMMC_D0 = "GPIO_NUM_39"
SOLAR_OS_BOARD_PIN_SDMMC_D1 = "GPIO_NUM_40"
SOLAR_OS_BOARD_PIN_SDMMC_D2 = "GPIO_NUM_41"
SOLAR_OS_BOARD_PIN_SDMMC_D3 = "GPIO_NUM_42"
SOLAR_OS_BOARD_I2S_PORT = "I2S_NUM_0"
SOLAR_OS_BOARD_PIN_I2S_MCLK = "GPIO_NUM_30"
SOLAR_OS_BOARD_PIN_I2S_BCLK = "GPIO_NUM_27"
SOLAR_OS_BOARD_PIN_I2S_DIN = "GPIO_NUM_28"
SOLAR_OS_BOARD_PIN_I2S_WS = "GPIO_NUM_29"
SOLAR_OS_BOARD_PIN_I2S_DOUT = "GPIO_NUM_26"
SOLAR_OS_BOARD_AUDIO_CODEC_OUT = '"ES8311"'
SOLAR_OS_BOARD_AUDIO_CODEC_IN = '"ES8311"'
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_37"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_38"

[runtime]
uart_ports = ["UART_NUM_1", "UART_NUM_2"]
i2s_ports = ["I2S_NUM_1"]

[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 31
scl = 32
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "i2c1"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_1"
sda = 0
scl = 1
speed_hz = "SOLAR_OS_BUS_I2C_DEFAULT_SPEED_HZ"

[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 37
rx = 38
baud_rate = "SOLAR_OS_BUS_UART_DEFAULT_BAUD_RATE"

[[devices]]
driver = "m5tab5"
name = "display0"
bindings = { bl = 22, active = 1, pwm = 1 }

[[devices]]
driver = "m5tab5-touch"
name = "touch0"
bindings = { i2c = "i2c0", addr = 0x55, irq = 23 }

[[devices]]
driver = "m5tab5-keyboard"
name = "keyboard0"
bindings = { i2c = "i2c1", addr = 0x6d, irq = 50 }

[[devices]]
driver = "ina226"
name = "battery0"
bindings = { i2c = "i2c0", addr = 0x41 }

[[devices]]
driver = "rx8130"
name = "rtc0"
bindings = { i2c = "i2c0", addr = 0x32 }

[[devices]]
driver = "es8311-duplex"
name = "audio0"
bindings = { i2c = "i2c0", i2s = 0, mclk = 30, bck = 27, ws = 29, din = 28, dout = 26 }

[[devices]]
driver = "sdmmc"
name = "storage0"
bindings = { clk = 43, cmd = 44, d0 = 39, d1 = 40, d2 = 41, d3 = 42 }

[[pins]]
gpio = 0
policy = "fixed"
role = "External I2C SDA"

[[pins]]
gpio = 1
policy = "fixed"
role = "External I2C SCL"


[[pins]]
gpio = 22
policy = "fixed"
role = "LCD backlight PWM"

[[pins]]
gpio = 23
policy = "fixed"
role = "Touch interrupt"

[[pins]]
gpio = 26
policy = "fixed"
role = "I2S DOUT"

[[pins]]
gpio = 27
policy = "fixed"
role = "I2S BCLK"

[[pins]]
gpio = 28
policy = "fixed"
role = "I2S DIN"

[[pins]]
gpio = 29
policy = "fixed"
role = "I2S WS"

[[pins]]
gpio = 30
policy = "fixed"
role = "I2S MCLK"

[[pins]]
gpio = 31
policy = "fixed"
role = "System I2C SDA"

[[pins]]
gpio = 32
policy = "fixed"
role = "System I2C SCL"

[[pins]]
gpio = 37
policy = "fixed"
role = "UART0 TX"

[[pins]]
gpio = 38
policy = "fixed"
role = "UART0 RX"

[[pins]]
gpio = 39
policy = "fixed"
role = "SDMMC D0"

[[pins]]
gpio = 40
policy = "fixed"
role = "SDMMC D1"

[[pins]]
gpio = 41
policy = "fixed"
role = "SDMMC D2"

[[pins]]
gpio = 42
policy = "fixed"
role = "SDMMC D3"

[[pins]]
gpio = 43
policy = "fixed"
role = "SDMMC CLK"

[[pins]]
gpio = 44
policy = "fixed"
role = "SDMMC CMD"

[[pins]]
gpio = 50
policy = "fixed"
role = "Keyboard IRQ"

[[pins]]
gpio = 53
policy = "fixed"
role = "Grove I2C SDA"

[[pins]]
gpio = 54
policy = "fixed"
role = "Grove I2C SCL"

[[pins]]
gpio = 8
